spring.application.name=swiggy-restaurant-service

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
# CRITICAL: Different port from User Service (8082)
# Microservices run simultaneously on different ports
server.port=8083


# ===================================================================
# DATASOURCE CONFIGURATION
# ===================================================================
# Points to the restaurant_user schema we just created
spring.datasource.url=jdbc:oracle:thin:@localhost:1522/FREEPDB1
spring.datasource.username=restaurant_user
spring.datasource.password=restaurant_pass
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection pool settings (optional but good practice)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# validate = Hibernate checks schema matches entities, doesn't create tables
# Flyway creates tables, Hibernate validates them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# ===================================================================
# FLYWAY CONFIGURATION
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# LOGGING
# ===================================================================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
