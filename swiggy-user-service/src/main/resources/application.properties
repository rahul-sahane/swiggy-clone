# ===================================================================
# SERVER CONFIG
# ===================================================================
server.port=8082

spring.application.name=user-service

# ===================================================================
# DATABASE CONFIG (Oracle)
# ===================================================================
# Format: jdbc:oracle:thin:@<host>:<port>/<service_name>
spring.datasource.url=jdbc:oracle:thin:@localhost:1522/FREEPDB1
spring.datasource.username=swiggy_user
spring.datasource.password=swiggy_pass
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===================================================================
# JPA / HIBERNATE CONFIG
# ===================================================================
# ddl-auto=validate -> Hibernate only CHECKS the schema matches our entities,
# it never creates/alters tables itself. Flyway (below) owns schema changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# ===================================================================
# FLYWAY CONFIG (database migrations)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# JWT CONFIG
# ===================================================================
# In production, set JWT_SECRET as an actual environment variable -
# never commit a real secret to GitHub. This default is only for local dev.
jwt.secret=${JWT_SECRET:change-this-in-prod-to-a-256-bit-secret-key-minimum}
jwt.expiration-ms=86400000

# ===================================================================
# LOGGING (optional, helpful while learning/debugging)
# ===================================================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG